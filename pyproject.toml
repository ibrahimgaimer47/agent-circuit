[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-circuit"
version = "0.1.0"
description = "Zero-dependency circuit breaker, infinite-loop detector, and token budget guardrail for AI agents and MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ibrahim Daouadji" }
]
keywords = ["ai-agents", "mcp", "llm", "circuit-breaker", "guardrails", "agentic-ai", "token-budget"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
